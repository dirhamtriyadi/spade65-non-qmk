name: tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -v
      - run: python -m compileall -q spade65 spade65ctl.py tests
      - run: node --check spade65/web/layout-state.js
      - run: node --check spade65/web/app.js
      - run: node tests/layout_state.test.js

  windows-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
      - name: Install pinned desktop build dependencies
        run: |
          python -m pip install -r requirements-build.txt ".[cross-platform,desktop]"
          python -m pip check
          python -m pip freeze
      - name: Build and smoke-test Windows package
        run: python packaging/build.py

  linux-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    env:
      SPADE65_STRICT_LINUX_LEGAL: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
      - name: Install Linux desktop runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libstdc++6 libgcc-s1 libgbm1 libfontconfig1 libfreetype6 \
            libexpat1 libx11-6 libx11-xcb1 libasound2 libegl1 libgl1 \
            libxcb-shape0 libxcb-image0 libxcb-xkb1 \
            libxcb-icccm4 libxkbcommon-x11-0 libxcb-util1 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-render-util0
      - name: Install pinned desktop build dependencies
        run: |
          python -m pip install -r requirements-build.txt ".[desktop]"
          python -m pip check
          python -m pip freeze
      - name: Build and smoke-test Linux AppImage
        run: python packaging/build.py

  macos-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    env:
      ARCHFLAGS: "-arch x86_64 -arch arm64"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download and verify Python.org universal2 installer
        run: bash packaging/prepare_macos_ci.sh download
      - name: Install Python.org universal2 interpreter
        run: bash packaging/prepare_macos_ci.sh install
      - name: Verify universal2 framework interpreter
        run: bash packaging/prepare_macos_ci.sh verify
      - name: Create and verify universal2 build environment
        run: bash packaging/prepare_macos_ci.sh venv
      - name: Install pinned build dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation ".[desktop]"
          python -m pip check
          python -m pip freeze
      - name: Build and verify universal2 HID extension
        run: bash packaging/build_macos_hidapi.sh
      - name: Build and smoke-test universal macOS disk image
        run: python packaging/build.py
