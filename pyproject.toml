[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spade65-non-qmk"
version = "0.6.0"
description = "Cross-platform configuration utility for the non-QMK Noir Spade65"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "dirhamtriyadi"}]
dependencies = []

[project.optional-dependencies]
cross-platform = ["hidapi>=0.14,<1"]

[project.scripts]
spade65ctl = "spade65.cli:main"

[tool.setuptools]
packages = ["spade65", "spade65.web"]

[tool.setuptools.package-data]
spade65 = ["web/*.html", "web/*.css", "web/*.js", "web/locales/*.json"]
