[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spade65-non-qmk"
version = "0.3.0"
description = "Experimental Linux configuration utility for the non-QMK Noir Spade65"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dirhamtriyadi"}]
dependencies = []

[project.scripts]
spade65ctl = "spade65.cli:main"

[tool.setuptools]
packages = ["spade65"]
